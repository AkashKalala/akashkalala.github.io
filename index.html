<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akash Kalala</title>
<style>
:root { --bg:#0B1622; --text:#F2F7FC; --muted:#9BB0C4; --amber:#FFB01F; --border:#2A4762; }
body { margin:0; background:var(--bg); color:var(--text);
  font:16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.wrap { max-width:640px; margin:0 auto; padding:64px 20px; }
h1 { font-size:28px; margin:0 0 6px; }
p { color:var(--muted); }
ul { list-style:none; padding:0; margin-top:28px; }
li { padding:14px 0; border-top:1px solid var(--border); }
a { color:var(--amber); text-decoration:none; font-weight:700; }
a:hover { text-decoration:underline; }
small { color:var(--muted); display:block; font-weight:400; margin-top:2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Akash Kalala</h1>
  <p>Projects and their support pages.</p>
  <ul>
    <li><a href="tenfold/">Tenfold</a>
      <small>A contract-rummy card game for iOS and Android.</small></li>
    <li><a href="rentfall/">Rentfall</a>
      <small>A property-trading card game for iOS and Android.</small></li>
  </ul>
</div>
</body>
</html>
